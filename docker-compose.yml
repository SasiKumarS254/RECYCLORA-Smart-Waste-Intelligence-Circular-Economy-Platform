version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: recyclora_postgres
    restart: always
    environment:
      POSTGRES_DB: recyclora_db
      POSTGRES_USER: recyclora_user
      POSTGRES_PASSWORD: recyclora_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recyclora_user -d recyclora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recyclora_backend
    restart: always
    environment:
      ENV: production
      SECRET_KEY: recyclora_super_secret_jwt_key_2026_change_in_production
      DATABASE_URL: postgresql://recyclora_user:recyclora_secure_password_2026@postgres:5432/recyclora_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recyclora_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
